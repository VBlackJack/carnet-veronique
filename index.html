<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241c18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="engine/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="engine/icon.svg">
  <title>Carnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2f2a;
      --ink-soft: #6b5a4e;
      --paper: #f1e6cf;
      --card: #fbf3e2;
      --night: #241c18;
      --rust: #a85a3a;
      --teal: #4d6b68;
      --ochre: #c99a4b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--night) radial-gradient(ellipse at 50% 0%, #3a2c24 0%, var(--night) 70%);
      color: var(--ink);
      font-family: "Alegreya", Georgia, serif;
      padding: 32px 16px 48px;
    }
    header { text-align: center; color: var(--paper); margin: 0 auto 28px; max-width: 760px; }
    h1 { font-family: "Caveat", cursive; font-size: clamp(44px, 9vw, 76px); margin: 0; line-height: 1; }
    header p { margin: 10px 0 0; font-style: italic; color: #d9c9a6; font-size: 18px; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 380px));
      justify-content: center;
      gap: 24px;
      max-width: 1060px;
      margin: 0 auto;
    }
    .case {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      transform: rotate(-0.6deg);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .case:nth-child(2n) { transform: rotate(0.7deg); }
    .case:hover, .case:focus-visible { transform: rotate(0) translateY(-4px); box-shadow: 0 16px 34px rgba(0, 0, 0, 0.55); outline: none; }
    .case svg { display: block; width: 100%; height: auto; border-bottom: 3px solid var(--ink); background: #e9dcc0; }
    .case .text { padding: 14px 18px 18px; }
    .case h2 { font-family: "Caveat", cursive; font-size: 34px; margin: 0; line-height: 1.05; color: var(--rust); }
    .case p { margin: 8px 0 14px; line-height: 1.4; }
    .play { display: inline-block; font-family: "Caveat", cursive; font-size: 24px; background: #f6d79b; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 16px; }
    footer { text-align: center; color: #b9a98a; margin-top: 36px; font-family: "Caveat", cursive; font-size: 22px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </header>
  <main id="shelf"></main>
  <footer id="footer"></footer>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

  <script>window.CH = { episode: {} };</script>
  <script src="engine/js/config.js?v=20261022.1334"></script>
  <script src="engine/locales/fr-ui.js?v=20261022.1334"></script>
  <script src="locales/fr-shelf.js?v=20261022.1334"></script>
  <script src="engine/js/i18n.js?v=20261022.1334"></script>
  <script src="engine/js/art/kit.js?v=20261022.1334"></script>
  <script src="shelf.js?v=20261022.1334"></script>
  <script>
    // Covers drawn with the same kit as the games.
    (function () {
      const A = CH.art, P = A.P;
      const COVERS = {
        goat() {
          A.srand(42);
          let s = `<rect width="480" height="270" fill="#d8dccf"/>`;
          s += A.sh(A.soft([[-20, 170], [160, 150], [320, 165], [500, 145], [500, 290], [-20, 290]], 4), P.meadowFar, { sw: 2 });
          s += A.sh(A.soft([[-20, 205], [200, 190], [500, 200], [500, 290], [-20, 290]], 4), P.meadow, { sw: 2 });
          for (let x = 10; x < 480; x += 70) s += A.sh(A.rect(x, 150, 10, 70, 1), P.wood, { sw: 2 });
          s += A.sh(A.rect(-10, 168, 500, 8, 1), P.woodLight, { sw: 2 });
          s += A.namedGoat("biscotte", 300, 250, 1.15, true);
          s += `<rect width="480" height="270" fill="url(#g-mist)" opacity=".35"/>`;
          return s;
        },
      };
      document.getElementById("defs").innerHTML = A.defs();
      const esc = CH.i18n.escapeHtml;
      const t = CH.t;
      document.title = t("shelf.page_title");
      document.getElementById("title").textContent = t("shelf.page_title");
      document.getElementById("tagline").textContent = t("shelf.tagline");
      document.getElementById("footer").textContent = t("shelf.footer");
      document.getElementById("shelf").innerHTML = CH.shelf
        .filter((e) => e.released)
        .map((e) => `<a class="case" href="episodes/${e.id}/index.html">
            <svg viewBox="0 0 480 270" aria-hidden="true"><g filter="url(#f-rough)">${COVERS[e.cover] ? COVERS[e.cover]() : ""}</g></svg>
            <div class="text"><h2>${esc(t(`shelf.${e.id}.title`))}</h2><p>${esc(t(`shelf.${e.id}.tagline`))}</p><span class="play">${esc(t("shelf.play"))}</span></div>
          </a>`)
        .join("");
    })();
  </script>
</body>
</html>
